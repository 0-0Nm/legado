name: Cover title font v15 CI

'on':
  push:
    branches:
      - 'feat/cover-title-font'

permissions:
  contents: read

jobs:
  app-debug-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bound Gradle and Kotlin daemon memory for this feature CI job
        # The previous feature run died with a Kotlin daemon OOM in
        # :app:compileAppDebugKotlin on the default heap. These limits live
        # only in this workflow's runner-local gradle.properties, not in the
        # project: ubuntu-latest gives 4 vCPU / 16 GB (7 GB on smaller
        # runners), so Gradle 3g + Kotlin daemon 4g + 2 workers stays safe.
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
          org.gradle.workers.max=2
          kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m
          EOF
          cat "$HOME/.gradle/gradle.properties"

      - name: Run AppDebug unit tests and assemble the arm64 APK
        # Omitting RELEASE_STORE_FILE leaves AppDebug on Android's default debug signing config.
        run: ./gradlew :app:testAppDebugUnitTest :app:assembleAppDebug -Pabi=arm64-v8a --max-workers=2 --no-daemon --stacktrace

      - name: Verify the debug APK applicationId, signing and record its SHA-256
        id: apk
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/app/debug/legado_app_*.apk)
          if (( ${#apks[@]} != 1 )) || [[ ! -s ${apks[0]} ]]; then
            echo '::error::Expected exactly one nonempty AppDebug APK'
            exit 1
          fi

          aapt2=$(find "${ANDROID_HOME:?}/build-tools" -mindepth 2 -maxdepth 2 -name aapt2 -type f | sort -V | tail -n 1)
          if [[ ! -x "$aapt2" ]]; then
            echo '::error::Android SDK aapt2 not found'
            exit 1
          fi
          expected_package='io.legado.app.archivecoverfont'
          badging="$RUNNER_TEMP/app-debug-badging.txt"
          "$aapt2" dump badging "${apks[0]}" > "$badging"
          head -n 1 "$badging"
          if ! head -n 1 "$badging" | grep -Eq "^package: name='${expected_package//./\\.}'( |$)"; then
            echo '::error::AppDebug APK applicationId mismatch'
            exit 1
          fi
          grep -Ex "native-code: 'arm64-v8a'[[:space:]]*" "$badging"

          apksigner=$(find "${ANDROID_HOME:?}/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)
          if [[ ! -x "$apksigner" ]]; then
            echo '::error::Android SDK apksigner not found'
            exit 1
          fi
          "$apksigner" verify --print-certs "${apks[0]}" | tee "$RUNNER_TEMP/app-debug-signers.txt"
          grep -Eq '^(Signer #1 certificate DN|V2 Signer: certificate DN): (C=US, O=Android, CN=Android Debug|CN=Android Debug, O=Android, C=US)$' "$RUNNER_TEMP/app-debug-signers.txt"
          sha256sum "${apks[0]}"
          printf 'path=%s\n' "${apks[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload only the verified AppDebug APK
        uses: actions/upload-artifact@v4
        with:
          name: legado-cover-title-font-v15-app-debug-arm64
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
